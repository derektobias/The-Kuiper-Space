name: Refresh catalog data

on:
  schedule:
    # Every Monday at 09:00 UTC. Runs the exoplanet, asteroid, and gazetteer
    # fetches, then does ONE commit/push covering all three — a single
    # combined workflow so a single production deploy covers every
    # catalog's weekly refresh instead of three separate ones.
    - cron: "0 9 * * 1"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest exoplanet data
        run: node scripts/fetch-exoplanet-data.js

      - name: Fetch latest asteroid data
        run: node scripts/fetch-asteroid-data.js
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}

      - name: Install gazetteer fetch dependencies
        run: npm install shapefile adm-zip

      - name: Fetch latest gazetteer data
        run: node scripts/fetch-gazetteer-data.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/exoplanets.json data/asteroids.json data/gazetteer.json
          git diff --quiet --cached || (
            git commit -m "chore: refresh exoplanet, asteroid, and gazetteer data"
            git push
          )