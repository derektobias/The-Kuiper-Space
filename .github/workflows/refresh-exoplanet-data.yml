name: Refresh exoplanet data

on:
  schedule:
    # Every Monday at 09:00 UTC. Adjust as you like — the archive doesn't
    # update hourly, so weekly is more than enough.
    - cron: "0 9 * * 1"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest exoplanet data
        run: node scripts/fetch-exoplanet-data.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet data/exoplanets.json || (
            git add data/exoplanets.json
            git commit -m "chore: refresh exoplanet data"
            git push
          )