<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Solar System Orbit Simulation</title>
<link rel="stylesheet" href="../css/styles.css">
<style>
    .sim-wrapper {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 20px;
        padding: 30px 20px;
        flex-wrap: wrap;
    }

    .sim-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
    }

    .sim-label {
        font-size: 14px;
        font-weight: 600;
        color: #aaa;
        letter-spacing: 0.08em;
        text-transform: uppercase;
    }

    .sim-panel canvas {
        background: #000;
        border-radius: 10px;
        display: block;
    }
</style>
</head>

<body>

<header class="navbar">
<h1 class="logo">Planetary Comparison Lab</h1>
<nav>
    <ul class="nav-links">
        <li><a href="../index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="tool.html">Planetary Properties</a></li>
        <li><a href="scenario.html">Scenario Comparisons</a></li>
        <li><a href="simulations.html">Simulations</a></li>
        <li><a href="conversion.html">Unit Conversions</a></li>
        <li><a href="resources.html">Resources</a></li>
        <li><a href="merch.html">Merch</a></li>
        <li><a href="support.html">Support</a></li>
    </ul>
</nav>
</header>

<main>

    <h2 style="text-align:center; margin-top:30px;">Solar System Orbit Simulation</h2>

    <div class="sim-wrapper">

        <div class="sim-panel">
            <div class="sim-label">Inner Planets</div>
            <canvas id="canvas-inner"></canvas>
        </div>

        <div class="sim-panel">
            <div class="sim-label">Full Solar System</div>
            <canvas id="canvas-full"></canvas>
        </div>

        <div class="sim-panel">
            <div class="sim-label">Outer Planets</div>
            <canvas id="canvas-outer"></canvas>
        </div>

    </div>

</main>

<script src="../js/orbitSimulator.js"></script>

</body>
</html>
