<style>
    
    /* ── HERO ── */
    .viewer-hero {
        text-align: center;
        padding: 60px 20px 30px;
        max-width: 700px;
        margin: 0 auto;
    }

    .viewer-hero h1 {
        font-size: 36px;
        font-weight: 800;
        color: white;
        letter-spacing: -0.02em;
        margin-bottom: 12px;
    }

    .viewer-hero h1 span { color: #4da3ff; }

    .viewer-hero p {
        font-size: 16px;
        color: #8fa8cc;
        line-height: 1.65;
        margin: 0;
    }

    .hero-divider {
        width: 60px;
        height: 3px;
        background: linear-gradient(90deg, #4da3ff, #a78bfa);
        border-radius: 2px;
        margin: 16px auto 20px;
    }
    
    .viewer-controls {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        padding: 14px 20px;
        background: #0d1525;
        border-bottom: 1px solid #1e2e45;
    }

    .viewer-controls select {
        background: #121a2b;
        border: 1px solid #2a3a55;
        border-radius: 6px;
        padding: 6px 10px;
        color: white;
        font-size: 14px;
        cursor: pointer;
    }

    .viewer-btn {
        background: #121a2b;
        border: 1px solid #2a3a55;
        border-radius: 6px;
        padding: 6px 14px;
        color: white;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: border-color 0.2s, background 0.2s;
    }

    .viewer-btn:hover {
        border-color: #4da3ff;
        background: #1a2a40;
    }

    .viewer-btn.zoom {
        font-size: 18px;
        padding: 3px 12px;
    }

    .control-divider {
        width: 1px;
        height: 22px;
        background: #2a3a55;
    }

    .control-label {
        font-size: 13px;
        color: #aaa;
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        user-select: none;
    }

    .control-label input[type="checkbox"] {
        accent-color: #4da3ff;
        width: 15px;
        height: 15px;
        cursor: pointer;
    }

    /* ── VIEWER ── */
    /* Constrained on larger screens so there's real page margin on either
       side to scroll from — without this, the canvas spans edge-to-edge and
       a mouse wheel movement anywhere on the screen at that vertical
       position gets captured as zoom instead of page scroll. Reverts to
       full width below the site's usual tablet/mobile breakpoint, since
       touch devices don't have this scroll-vs-zoom conflict to begin with. */
    #viewer {
        width: 100%;
        max-width: 1100px;
        margin: 0 auto;
        height: 600px;
        cursor: grab;
    }
 
    #viewer:active {
        cursor: grabbing;
    }
 
    @media (max-width: 860px) {
        #viewer {
            max-width: 100%;
        }
    }

</style>
</head>

<body>

<script>const SITE_CONTEXT = "pages";</script>
<div id="nav-placeholder"></div>

<div class="viewer-hero">
    <h1>3D Planet <span>Viewer</span></h1>
    <div class="hero-divider"></div>
    <p>Explore and compare planetary surfaces across the planets, moon, and sun. Bodies tilted and rotating with respect to each other.</p>
</div>

<main>

    <p style="text-align:center; color:#aaa; font-size:13px; margin: 6px 0 0;">
        Drag to rotate &nbsp;·&nbsp; Scroll to zoom
    </p>

    <div class="viewer-controls">

        <!-- Body selector -->
        <span style="font-size:13px; color:#aaa;">Body:</span>
        <select id="planetSelect">
            <optgroup label="The Sun">
                <option value="sun.jpg">Sun</option>
            </optgroup>
            <optgroup label="Planets">
                <option value="mercury.jpg">Mercury</option>
                <option value="venus.jpg">Venus</option>
                <option value="earth.jpg" selected>Earth</option>
                <option value="mars.jpg">Mars</option>
                <option value="jupiter.jpg">Jupiter</option>
                <option value="saturn.jpg">Saturn</option>
                <option value="uranus.jpg">Uranus</option>
                <option value="neptune.jpg">Neptune</option>
            </optgroup>
            <optgroup label="Moons">
                <option value="moon.jpg">Moon</option>
            </optgroup>
        </select>

        <div class="control-divider"></div>

        <!-- Simulation speed -->
        <span style="font-size:13px; color:#aaa;">Speed:</span>
        <select id="timeSpeed">
            <option value="0">0×</option>
            <option value="0.25">0.25×</option>
            <option value="1" selected>1×</option>
            <option value="5">5×</option>
            <option value="10">10×</option>
        </select>

        <div class="control-divider"></div>

        <!-- Zoom -->
        <button id="zoomInBtn"  class="viewer-btn zoom" title="Zoom in">+</button>
        <button id="zoomOutBtn" class="viewer-btn zoom" title="Zoom out">−</button>

        <div class="control-divider"></div>

        <!-- Realistic scale -->
        <label class="control-label" title="Scale bodies by their true relative sizes">
            <input type="checkbox" id="scaleToggle">
            Realistic Scale
        </label>

        <div class="control-divider"></div>

        <!-- Shadow toggle -->
        <label class="control-label" title="Toggle day/night shading">
            <input type="checkbox" id="shadowToggle" checked>
            Shadows
        </label>
 
        <div class="control-divider"></div>
 
        <!-- Reset -->
        <button id="resetViewerBtn" class="viewer-btn" title="Reset zoom, speed, and display settings">↺ Reset</button>
 
    </div>
 
    <div id="viewer"></div>
 
</main>
